[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jnwb"
version = "0.1.0"
description = "Generic NWB analysis library. The omission/ folder holds this repo's native large-dataset example project."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pynwb",
    "numpy",
    "pandas",
    "h5py",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "plotly",
    # Added 2026-08-08 after an AST scan found them imported but undeclared. Everything
    # worked only because the dev venv happened to have them; a fresh `pip install -e .`
    # produced an env that failed at import time deep inside an analysis run.
    "statsmodels",   # 17 import sites: every GLMM and FDR path (jrsa, viz, 8 scripts)
    "joblib",        # jnwb/jrsa.py parallel map
    "hdmf",          # jnwb/__init__.py NWB builder monkeypatches; transitive via pynwb,
                     # but imported directly, so declared directly.
    # mcp 2.0 (2026-07-28) removed mcp.server.fastmcp, which jnwb/mcp_server/server.py
    # imports; pin to the v1 line until that module is migrated to the v2 API.
    "mcp<2.0",
    # Added 2026-08-11: fig03_unit_census.py's UMAP supplement panel imports umap
    # unconditionally, so a fresh venv without umap-learn fails the ENTIRE fig03 pipeline
    # (main figure included) at the last panel, not just the supplement -- found while
    # closing/freezing fig03.
    "umap-learn",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.0",  # `pytest -n auto`: ~2.5x wall-clock on this suite (170s -> 69s)
]
torch = [
    "torch",
]
# GPU backends. Both are optional by design: every module that uses them must also work
# on CPU (see the numerical-computing skill). cupy wheels are CUDA-version-specific --
# `cupy-cuda12x` for the CUDA 12 line this project runs on.
gpu = [
    "cupy-cuda12x",
    "jax",
]
docs = [
    "python-docx",   # scripts/build_clean_publication_figures.py, generate_publication_figures.py
]
kilosort = [
    "kilosort>=4.0",
]
all = [
    "jnwb[test,torch,gpu,docs,kilosort]",
]

[tool.setuptools]
packages = ["jnwb", "omission", "omission.jnwb_ext"]
package-dir = {"" = "."}

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "omission/tests"]
