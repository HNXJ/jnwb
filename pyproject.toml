[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omission"
version = "0.1.0"
description = "V1-PFC Predictive Routing (Omission) research analysis framework"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pynwb",
    "numpy",
    "pandas",
    "h5py",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "plotly",
    # mcp 2.0 (2026-07-28) removed mcp.server.fastmcp, which jnwb/mcp_server/server.py
    # imports; pin to the v1 line until that module is migrated to the v2 API.
    "mcp<2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]
torch = [
    "torch",
]
kilosort = [
    "kilosort>=4.0",
]
all = [
    "omission[test,torch,kilosort]",
]

[tool.setuptools]
packages = ["jnwb"]
package-dir = {"" = "."}

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
