[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omission"
version = "0.1.0"
description = "V1-PFC Predictive Routing (Omission) Analysis Pipeline"
readme = "README.md"
requires-python = ">=3.8"

[tool.setuptools]
packages = ["src"]
package-dir = {"" = "."}

[tool.pytest.ini_options]
pythonpath = ["."]
