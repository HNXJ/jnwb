[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jnwb"
dynamic = ["version"]
description = "Generic Python library for high-density electrophysiology, time-frequency analysis, and statistical neuroscience on Neurodata Without Borders (NWB) datasets."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Hamed Nejat" }
]
maintainers = [
    { name = "Hamed Nejat" }
]
requires-python = ">=3.12, <3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
keywords = [
    "neuroscience",
    "electrophysiology",
    "nwb",
    "neurodata-without-borders",
    "lfp",
    "spikes",
    "time-frequency",
    "morlet-wavelet",
    "granger-causality",
    "phase-slope-index",
]
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "pandas>=1.4.0",
    "h5py>=3.6.0",
    "pynwb>=2.0.0",
    "hdmf>=3.1.0",
    "matplotlib>=3.5.0",
    "scikit-learn>=1.0.0",
    "statsmodels>=0.13.0",
    "joblib>=1.1.0",
]

[project.optional-dependencies]
mcp = [
    "mcp<2.0",
]
torch = [
    "torch>=1.12.0",
]
gpu = [
    "cupy-cuda12x",
    "jax",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.0",
    "build>=1.0.0",
    "twine>=4.0.0",
    "pyyaml>=6.0",
    "mcp<2.0",
]
docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "myst-parser>=1.0.0",
]
all = [
    "jnwb[mcp,torch,gpu,test,docs]",
]

[project.urls]
Homepage = "https://github.com/HNXJ/jnwb"
Repository = "https://github.com/HNXJ/jnwb.git"
Documentation = "https://jnwb.readthedocs.io/"
"Bug Tracker" = "https://github.com/HNXJ/jnwb/issues"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.dynamic]
version = { attr = "jnwb.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["jnwb*"]
exclude = ["omission*", "tests*", "docs*", "scripts*", "artifacts*", "jnwb._unused*", "jnwb._unused", ".lab_bundle_build*"]

[tool.setuptools.package-data]
jnwb = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
