name: dashboard

# Builds the jnwb dashboard from committed records and publishes it to the gh-pages branch,
# which serves https://hnxj.github.io/jnwb/. Only dev triggers it; the publish never forces.

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  publish:
    # A manual run on another branch would publish that branch's build.
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.14"

      - name: Install jnwb and PyYAML
        run: |
          python -m pip install -e . "pyyaml>=6.0.1"

      - name: Build dashboard
        run: |
          python scripts/build_dashboard.py --out "$RUNNER_TEMP/site"

      - name: Check build is complete and from this commit
        run: |
          python scripts/check_dashboard_build.py "$RUNNER_TEMP/site" "$GITHUB_SHA"

      - name: Validate data.json against its schema
        run: |
          python -m pip install "jsonschema>=4.18"
          python -m jsonschema --instance "$RUNNER_TEMP/site/data.json" scripts/dashboard/data.schema.json

      # The route test loads every route in Chromium, light and dark. Here a missing browser fails
      # the step; it does not skip.
      - name: Run the route test in Chromium, light and dark
        env:
          JNWB_REQUIRE_BROWSER: "1"
        run: |
          python -m pip install "playwright==1.62.0" pytest
          python -m playwright install --with-deps chromium
          python -m pytest tests/test_dashboard_page.py::test_every_route_renders_in_light_and_dark_without_errors -q -p no:cacheprovider

      - name: Add .nojekyll
        run: |
          touch "$RUNNER_TEMP/site/.nojekyll"

      # Plain git: the repository allows only its own, GitHub's and pypa's publish action.
      - name: Publish to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add --detach "$RUNNER_TEMP/pages" origin/gh-pages
          cd "$RUNNER_TEMP/pages"
          git rm -r -q --ignore-unmatch .
          cp -a "$RUNNER_TEMP/site/." .
          git add --all .
          if git diff --cached --quiet; then echo "gh-pages already holds this build"; exit 0; fi
          git commit -q -m "Dashboard from $GITHUB_SHA"
          git push origin HEAD:gh-pages
