name: dashboard

# Builds the jnwb dashboard from committed records and publishes it to the gh-pages branch,
# which serves https://hnxj.github.io/jnwb/. Only main triggers it; the publish never forces.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  publish:
    # A manual run on another branch would publish that branch's build.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install jnwb and PyYAML
        run: |
          python -m pip install -e . "pyyaml>=6.0.1"

      - name: Build dashboard
        run: |
          python scripts/build_dashboard.py --out "$RUNNER_TEMP/site"

      - name: Check build is complete and from this commit
        run: |
          python scripts/check_dashboard_build.py "$RUNNER_TEMP/site" "$GITHUB_SHA"

      - name: Add .nojekyll
        run: |
          touch "$RUNNER_TEMP/site/.nojekyll"

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: "${{ runner.temp }}/site"
          force_orphan: false
          keep_files: false
          commit_message: "Dashboard from ${{ github.sha }}"
