name: dashboard

# Builds the jnwb dashboard from committed records and publishes it to the gh-pages branch,
# which serves https://hnxj.github.io/jnwb/. Only main triggers it; the publish never forces.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  publish:
    # A manual run on another branch would publish that branch's build.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install jnwb and PyYAML
        run: |
          python -m pip install -e . "pyyaml>=6.0.1"

      - name: Build dashboard
        run: |
          python scripts/build_dashboard.py --out "$RUNNER_TEMP/site"

      - name: Check build is complete and from this commit
        run: |
          python scripts/check_dashboard_build.py "$RUNNER_TEMP/site" "$GITHUB_SHA"

      - name: Add .nojekyll
        run: |
          touch "$RUNNER_TEMP/site/.nojekyll"

      # Plain git: the repository allows only its own, GitHub's and pypa's publish action.
      - name: Publish to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add --detach "$RUNNER_TEMP/pages" origin/gh-pages
          cd "$RUNNER_TEMP/pages"
          git rm -r -q --ignore-unmatch .
          cp -a "$RUNNER_TEMP/site/." .
          git add --all .
          if git diff --cached --quiet; then echo "gh-pages already holds this build"; exit 0; fi
          git commit -q -m "Dashboard from $GITHUB_SHA"
          git push origin HEAD:gh-pages
