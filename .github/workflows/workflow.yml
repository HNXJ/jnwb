name: CI/CD

on:
  push:
    branches: [ main, dev ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:
    inputs:
      target:
        description: "Publication target (none or testpypi)"
        required: true
        # Defaulted to testpypi, so pressing Run workflow without reading the form
        # published. Publishing is the deliberate choice, not the resting state.
        default: "none"
        type: choice
        options:
          - "none"
          - "testpypi"

# Least privilege at the top, raised per job where a job needs it: the two publish jobs
# each ask for id-token: write, and github-release alone asks for contents: write. Without a
# floor here every job inherited whatever the repository default was, on a pipeline that can
# upload to PyPI.
permissions:
  contents: read

# One run per ref. Two pushes in quick succession ran overlapping publish-capable
# pipelines; the later one now cancels the earlier. Tags are excluded: a tag push is the run
# that publishes, and cancelling one mid-upload is the failure this is meant to prevent, not
# a cost worth paying for a faster queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  qualified:
    # A release tag is pushed onto a commit main has already tested. On a `v*` tag push, when a
    # main push run of this workflow at the same commit concluded success, `run_id` names that
    # run and the test and floors legs skip their steps, saying which run tested the commit.
    # The build still runs, so the files TestPyPI and then PyPI receive are built and checked in
    # this run. Every other event, no such run, and a failed query leave `run_id` empty, and
    # every leg runs in full.
    name: Find a passed main run of this commit
    runs-on: ubuntu-latest
    permissions:
      actions: read  # To read this commit's main push runs
      contents: read
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # The token only reads runs; nothing after checkout needs it in .git/config.
          persist-credentials: false

      - name: Look up a successful main push run at this commit
        id: find
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.event_name }}:${{ github.ref }}
        run: |
          set -uo pipefail
          run_id=""
          case "$EVENT_REF" in
            push:refs/tags/v*)
              if ! run_id=$(gh api "repos/$REPO/actions/runs?event=push&branch=main&head_sha=$SHA&status=success&per_page=100" \
                  | python3 scripts/workflow_checks.py qualifying-run --sha "$SHA"); then
                echo "::warning::the Actions API could not be read; this run tests the commit"
                run_id=""
              fi ;;
          esac
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Passed main push run of $SHA: ${run_id:-none, so this run tests the commit}"

  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    # On a tag push that `qualified` matched to a passed main run, every step after the first is
    # skipped; the job stays, because build needs it and a skipped job would skip the build and
    # every publish job after it.
    needs: qualified
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      QUALIFIED_BY: ${{ needs.qualified.outputs.run_id }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.12", "3.13", "3.14", "3.15" ]
        # h5py ships no CPython 3.15 wheel yet. Ubuntu builds it against the system HDF5 headers,
        # and the Windows leg waits for a wheel.
        exclude:
          - os: windows-latest
            python-version: "3.15"
        # The one leg that must compare the documentation figures: it pins the Matplotlib release
        # that wrote them, so a newer minor release reaching the other legs cannot turn every
        # comparison into a skip. Windows and 3.14, as the figures were rendered.
        include:
          - os: windows-latest
            python-version: "3.14"
            figures: compared

    steps:
      - name: Report the main push run that tested this commit
        if: env.QUALIFIED_BY != ''
        shell: bash
        run: echo "Tested in run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$QUALIFIED_BY"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        if: env.QUALIFIED_BY == ''

      - name: Set up Python ${{ matrix.python-version }}
        if: env.QUALIFIED_BY == ''
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
          # Prereleases are admitted for 3.15 only.
          allow-prereleases: ${{ matrix.python-version == '3.15' }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the HDF5 headers that h5py builds against
        if: matrix.python-version == '3.15' && env.QUALIFIED_BY == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev pkg-config

      - name: Install Liberation Sans for the documentation figures
        # The committed figures are drawn in Liberation Sans, and
        # tests/test_generated_figures_are_maintained.py compares them pixel for pixel, so every
        # leg that runs it, Windows included, draws with the same font file: the 2.1.5 release
        # tarball, held to its sha256 and handed to the figure style through JNWB_FIGURE_FONT_DIR.
        if: env.QUALIFIED_BY == ''
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors --connect-timeout 30 -o liberation-fonts.tar.gz https://github.com/liberationfonts/liberation-fonts/files/7261482/liberation-fonts-ttf-2.1.5.tar.gz
          echo "7191c669bf38899f73a2094ed00f7b800553364f90e2637010a69c0e268f25d0  liberation-fonts.tar.gz" | sha256sum -c -
          tar xzf liberation-fonts.tar.gz
          echo "JNWB_FIGURE_FONT_DIR=$RUNNER_TEMP/liberation-fonts-ttf-2.1.5" >> "$GITHUB_ENV"

      - name: Install dependencies
        if: env.QUALIFIED_BY == ''
        env:
          HDF5_PKGCONFIG_NAME: hdf5-serial
        # `vis` so jnwb.vis is exercised on every leg. No leg runs the suite without Plotly: the
        # build job's smoke step checks the wheel without the extra, and
        # tests/test_optional_vis_extra.py blocks Plotly in a subprocess. `wavemap` so the UMAP and
        # Louvain tests of jnwb.wavemap run instead of skipping.
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test,docs,vis,wavemap]"

      - name: Pin Matplotlib to the release that wrote the committed figures
        # tests/test_generated_figures_are_maintained.py holds this pin to the version the PNGs
        # record; regenerating the figures with another release fails that test until it moves.
        if: matrix.figures == 'compared' && env.QUALIFIED_BY == ''
        run: |
          python -m pip install "matplotlib==3.11.2"

      - name: Build artifacts/state.md for the state tests
        # tests/test_state_basis_is_checked.py and tests/test_state_reconstruction.py skip while
        # artifacts/state.md is absent, which is every fresh checkout. One Linux leg builds it
        # before pytest, so those tests run in CI. The file is gitignored.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && env.QUALIFIED_BY == ''
        run: python scripts/reconstruct_state.py

      - name: Run pytest
        if: env.QUALIFIED_BY == ''
        # -n auto: one worker per core. The browser-backed export tests share an xdist group,
        # which `--dist=loadgroup` in pyproject.toml runs on one worker.
        env:
          JNWB_REQUIRE_FIGURE_COMPARISON: ${{ matrix.figures == 'compared' && '1' || '0' }}
          # The runner has Chrome: a missing one fails the browser-backed tests, not skips them.
          JNWB_REQUIRE_BROWSER: '1'
        run: |
          # Runs pytest and annotates each failed test; the exit status is pytest's own.
          python scripts/ci_pytest.py tests/

  test-floors:
    # The matrix legs install the newest release of every dependency, so the `>=` floors in
    # pyproject.toml are claims no other leg exercises. This leg resolves each core dependency
    # to the lowest release that installs alongside the others, on the floor interpreter, and
    # runs the suite there. A floor that resolves higher than declared fails the job, as does
    # any test. A failure here means a declared floor no longer holds, and
    # scripts/release_gate.py requires this job to succeed like every other job it requires.
    # The interpreter is the declared floor's first patch release: `requires-python >=3.12`
    # admits 3.12.0, and "3.12" would install the newest 3.12 patch, which no user is held to.
    # On a tag push the steps skip as the matrix legs' do, for the reason given there.
    name: Test (dependency floors, Python 3.12.0 on ubuntu-latest)
    needs: qualified
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FLOOR_PYTHON: "3.12.0"
      QUALIFIED_BY: ${{ needs.qualified.outputs.run_id }}

    steps:
      - name: Report the main push run that tested this commit
        if: env.QUALIFIED_BY != ''
        shell: bash
        run: echo "Tested in run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$QUALIFIED_BY"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        if: env.QUALIFIED_BY == ''

      - name: Set up Python ${{ env.FLOOR_PYTHON }}
        if: env.QUALIFIED_BY == ''
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.FLOOR_PYTHON }}

      - name: Install Liberation Sans for the documentation figures
        # As in the test job: the figure comparison draws with Liberation Sans.
        if: env.QUALIFIED_BY == ''
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors --connect-timeout 30 -o liberation-fonts.tar.gz https://github.com/liberationfonts/liberation-fonts/files/7261482/liberation-fonts-ttf-2.1.5.tar.gz
          echo "7191c669bf38899f73a2094ed00f7b800553364f90e2637010a69c0e268f25d0  liberation-fonts.tar.gz" | sha256sum -c -
          tar xzf liberation-fonts.tar.gz
          echo "JNWB_FIGURE_FONT_DIR=$RUNNER_TEMP/liberation-fonts-ttf-2.1.5" >> "$GITHUB_ENV"

      - name: Resolve the declared floors
        if: env.QUALIFIED_BY == ''
        # The floors are read with scripts/release_gate.py's parser rather than a second one.
        # Only the core dependencies are pinned; the test tooling resolves around them.
        run: |
          python -m pip install --upgrade pip uv
          python - <<'PY'
          import pathlib, sys
          sys.path.insert(0, '.')
          from scripts.release_gate import declared_dependency_floors
          core = [(name, floor) for extra, name, floor in declared_dependency_floors() if not extra]
          pathlib.Path('/tmp/floors.in').write_text(''.join(f'{n}>={f}\n' for n, f in core))
          PY
          uv pip compile --python-version "$FLOOR_PYTHON" --resolution lowest-direct \
            /tmp/floors.in -o /tmp/floors.lock
          python - <<'PY'
          import re, sys
          sys.path.insert(0, '.')
          from scripts.release_gate import declared_dependency_floors
          core = {n.lower(): f for extra, n, f in declared_dependency_floors() if not extra}
          pins = {}
          for line in open('/tmp/floors.lock'):
              m = re.match(r'([A-Za-z0-9_.\-]+)==(\S+)', line)
              if m and m.group(1).lower() in core:
                  pins[m.group(1).lower()] = m.group(2)
          missing = sorted(set(core) - set(pins))
          if missing:
              sys.exit(f'no resolved version for {missing}')
          higher = []
          with open('/tmp/floors.txt', 'w') as out:
              for name in sorted(pins):
                  out.write(f'{name}=={pins[name]}\n')
                  print(f'{name}: declared >={core[name]}, installed {pins[name]}')
                  if pins[name] != core[name]:
                      higher.append(name)
                      print(f'::error::{name}>={core[name]} resolves to {pins[name]} beside the '
                            f'other floors, so the declared floor cannot be installed or tested')
          if higher:
              sys.exit(f'declared floors that do not hold: {higher}')
          PY

      - name: Install dependencies at the floors
        if: env.QUALIFIED_BY == ''
        run: |
          python -m pip install ".[test,docs,vis,wavemap]" -c /tmp/floors.txt
          python -m pip list

      - name: Run pytest
        if: env.QUALIFIED_BY == ''
        env:
          JNWB_REQUIRE_BROWSER: '1'
        run: |
          python scripts/ci_pytest.py tests/

  test-pandas3:
    # Non-blocking, and no job needs it. hdmf declares pandas<3, so this leg installs pandas 3
    # after jnwb to run the suite on it. A failure here is a finding to read, not a red build.
    name: Test (pandas 3, Python 3.13 on ubuntu-latest, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"

      - name: Install Liberation Sans for the documentation figures
        # As in the test job: the figure comparison draws with Liberation Sans.
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors --connect-timeout 30 -o liberation-fonts.tar.gz https://github.com/liberationfonts/liberation-fonts/files/7261482/liberation-fonts-ttf-2.1.5.tar.gz
          echo "7191c669bf38899f73a2094ed00f7b800553364f90e2637010a69c0e268f25d0  liberation-fonts.tar.gz" | sha256sum -c -
          tar xzf liberation-fonts.tar.gz
          echo "JNWB_FIGURE_FONT_DIR=$RUNNER_TEMP/liberation-fonts-ttf-2.1.5" >> "$GITHUB_ENV"

      - name: Install jnwb, then pandas 3 over hdmf's pandas<3 cap
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test,docs,vis,wavemap]"
          python -m pip install "pandas>=3,<4"

      - name: Require pandas 3
        run: |
          python -c "import pandas; print(pandas.__version__); assert pandas.__version__.startswith('3'), pandas.__version__"

      - name: Run pytest
        env:
          JNWB_REQUIRE_BROWSER: '1'
        run: |
          python scripts/ci_pytest.py tests/

  build:
    name: Build & Validate Distribution
    needs: [test, test-floors]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install Liberation Sans for the documentation figures
        # The wheel suite below runs the figure comparison, which draws with Liberation Sans.
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors --connect-timeout 30 -o liberation-fonts.tar.gz https://github.com/liberationfonts/liberation-fonts/files/7261482/liberation-fonts-ttf-2.1.5.tar.gz
          echo "7191c669bf38899f73a2094ed00f7b800553364f90e2637010a69c0e268f25d0  liberation-fonts.tar.gz" | sha256sum -c -
          tar xzf liberation-fonts.tar.gz
          echo "JNWB_FIGURE_FONT_DIR=$RUNNER_TEMP/liberation-fonts-ttf-2.1.5" >> "$GITHUB_ENV"

      - name: Install build tools, documentation tools & dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test,docs]" build twine

      - name: Build artifacts/state.md for the pre-flight gate
        # Gate 20 reads artifacts/state.md and passes over it while the file is absent, as on a
        # fresh checkout, so this job builds the state before it runs the gate.
        run: python scripts/reconstruct_state.py

      - name: Run pre-flight harness gate
        run: |
          python scripts/harness_gate.py

      - name: Build documentation with MkDocs (strict)
        run: |
          python scripts/docs_build.py

      - name: Build sdist and wheel
        run: |
          python -m build

      - name: Validate distribution metadata and render README
        run: |
          twine check dist/*

      - name: Inspect archive manifests (anti-pollution check)
        shell: bash
        # The rule lives in scripts/release_gate.py and is called from here rather than
        # copied. The copy that used to live in this file carried the same defect, so
        # repairing one would have left CI shipping wheels with the suite inside them.
        run: |
          python -c "
          import pathlib, sys, tarfile, zipfile
          sys.path.insert(0, '.')
          from scripts.release_gate import forbidden_entries
          whl = list(pathlib.Path('dist').glob('*.whl'))[0]
          with zipfile.ZipFile(whl, 'r') as z:
              problems = ['wheel: ' + p for p in forbidden_entries(z.namelist())]
          sdist = list(pathlib.Path('dist').glob('*.tar.gz'))[0]
          with tarfile.open(sdist, 'r:gz') as t:
              problems += ['sdist: ' + p for p in forbidden_entries(t.getnames())]
          if problems:
              for problem in problems:
                  print('ERROR: ' + problem)
              sys.exit(1)
          print('PASS: Distribution manifests clean.')
          "

      - name: Test clean virtualenv wheel installation & smoke verification
        shell: bash
        run: |
          python -m venv /tmp/clean_env
          /tmp/clean_env/bin/pip install --upgrade pip
          /tmp/clean_env/bin/pip install dist/*.whl
          /tmp/clean_env/bin/pip check
          # The version the wheel's file name carries (PEP 427: name-version-...).
          version=$(basename dist/*.whl | cut -d- -f2)
          cd /tmp
          # PYTHONPATH is cleared, as in the tutorial step below, so the checkout cannot satisfy the
          # import.
          unset PYTHONPATH
          # The same script the TestPyPI verify job runs; from /tmp, so the import is the wheel's.
          /tmp/clean_env/bin/python "$GITHUB_WORKSPACE/scripts/smoke_installed.py" \
            --expected-version "$version" --not-under "$GITHUB_WORKSPACE"

      - name: Run the test suite against the installed wheel
        shell: bash
        run: |
          # The matrix legs run `pytest tests/` from the repository root, where
          # `pythonpath = ["."]` and `tests/__init__.py` both put the source tree ahead of
          # site-packages: they test the checkout, which merely also has the package
          # installed. This runs the same suite against the wheel built above -- from
          # outside the repository, with `pythonpath` cleared and pytest's rootdir
          # insertion suppressed by importlib import mode. JNWB_EXPECTED_PACKAGE_ROOT
          # makes tests/test_import_provenance.py assert that the package under test is
          # the installed one, so a leg that quietly falls back to the checkout fails
          # instead of passing. The test tooling is read out of pyproject.toml rather
          # than listed again here, and jnwb itself is not reinstalled from source. `vis` is
          # installed only now, after the smoke step above has checked the wheel without it.
          unset PYTHONPATH
          python - <<'PY'
          import pathlib, tomllib
          extras = tomllib.load(open('pyproject.toml', 'rb'))['project']['optional-dependencies']
          requirements = extras['test'] + extras['docs'] + extras['vis'] + extras['wavemap']
          pathlib.Path('/tmp/test-requirements.txt').write_text('\n'.join(requirements))
          PY
          /tmp/clean_env/bin/pip install -r /tmp/test-requirements.txt
          purelib=$(/tmp/clean_env/bin/python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          echo "Suite will run against: $purelib/jnwb"
          cd /tmp
          JNWB_REQUIRE_BROWSER=1 JNWB_EXPECTED_PACKAGE_ROOT="$purelib" /tmp/clean_env/bin/python -m pytest \
            --import-mode=importlib -o pythonpath= -n auto \
            --rootdir="$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/tests" -q

      - name: Run tutorials against the installed wheel (no repo-relative imports)
        shell: bash
        run: |
          # 0.2.4-03: the tutorials must execute against the distributed artifact, not the
          # checkout. PYTHONPATH is cleared and the CWD is outside the repository, so an
          # `import jnwb` that only works from the source tree fails here.
          #
          # Each tutorial also carries a guard that prefers the checkout it ships in, which
          # is right when a reader runs it from a clone and wrong here: it found the
          # sibling package under $GITHUB_WORKSPACE and sent this step back to the source
          # tree. JNWB_EXPECTED_PACKAGE_ROOT tells the guard to stand aside.
          unset PYTHONPATH
          export JNWB_EXPECTED_PACKAGE_ROOT=$(/tmp/clean_env/bin/python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          cd /tmp
          /tmp/clean_env/bin/python -c "
          import jnwb
          assert 'clean_env' in jnwb.__file__, f'jnwb resolved outside the clean env: {jnwb.__file__}'
          print('Tutorials will run against:', jnwb.__file__)
          "
          status=0
          for tutorial in "$GITHUB_WORKSPACE"/examples/tutorials/[0-9][0-9]_*.py; do
            name=$(basename "$tutorial")
            if /tmp/clean_env/bin/python "$tutorial" > "/tmp/tutorial_$name.log" 2>&1; then
              echo "PASS: $name"
            else
              echo "FAIL: $name"
              tail -30 "/tmp/tutorial_$name.log"
              status=1
            fi
          done
          exit $status

      - name: Store distribution artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    # Every tag push publishes to TestPyPI, a final tag as well as an rc one: publish-pypi below
    # uploads the files this job uploaded, this run's artifact checked against TestPyPI's
    # hashes, once that upload and its verification both succeeded.
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi')
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/jnwb
    permissions:
      id-token: write  # Mandatory for TestPyPI Trusted Publishing (OIDC)
      contents: read
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI via Trusted Publishing
        # Pinned to a commit, not the mutable release/v1 branch: this step runs with
        # id-token: write, so whatever that branch points at can mint an OIDC token for
        # this project. dc37677 is the commit v1.14.2 tags (released 2026-07-29).
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          verbose: true

  verify-testpypi:
    # The candidate as a user gets it: the tag's version installed from TestPyPI into a fresh
    # environment, then the build job's smoke script run against it from outside the checkout.
    # Only the candidate wheel is fetched from TestPyPI, without dependencies; it is then
    # installed from that local file with the default index, so every dependency comes from
    # PyPI and none can resolve to a TestPyPI upload of the same name.
    name: Verify the TestPyPI upload
    needs: publish-testpypi
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      final: ${{ steps.kind.outputs.final }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install the tag's version from TestPyPI and smoke-test it
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          python -m venv /tmp/testpypi_env
          /tmp/testpypi_env/bin/pip install --upgrade pip
          # The index can lag the upload by minutes; ten attempts, thirty seconds apart.
          for attempt in $(seq 1 10); do
            if /tmp/testpypi_env/bin/pip download --no-cache-dir --no-deps --only-binary :all: \
                --index-url https://test.pypi.org/simple/ "jnwb==$version" -d /tmp/candidate; then
              break
            fi
            if [ "$attempt" -eq 10 ]; then
              echo "::error::jnwb==$version could not be downloaded from TestPyPI"
              exit 1
            fi
            sleep 30
          done
          wheels=(/tmp/candidate/jnwb-*.whl)
          if [ "${#wheels[@]}" -ne 1 ] || [ ! -f "${wheels[0]}" ]; then
            echo "::error::expected one jnwb wheel from TestPyPI, found: ${wheels[*]}"
            exit 1
          fi
          /tmp/testpypi_env/bin/pip install --no-cache-dir "${wheels[0]}"
          /tmp/testpypi_env/bin/pip check
          cd /tmp
          # PYTHONPATH is cleared, as in the tutorial step of the build job, so the checkout cannot
          # satisfy the import.
          unset PYTHONPATH
          /tmp/testpypi_env/bin/python "$GITHUB_WORKSPACE/scripts/smoke_installed.py" \
            --expected-version "$version" --not-under "$GITHUB_WORKSPACE"

      - name: Decide whether the tag names a final release
        # Only a final release reaches PyPI; an rc, alpha, beta or dev tag stops at TestPyPI.
        # Final means PEP 440 final: release segments with at most a .postN. Any other spelling
        # reads as not final, so an unusual tag stays off PyPI rather than reaching it.
        id: kind
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if [[ "$version" =~ ^[0-9]+(\.[0-9]+)*(\.post[0-9]+)?$ ]]; then
            final=true
          else
            final=false
          fi
          echo "final=$final" >> "$GITHUB_OUTPUT"
          echo "jnwb $version final: $final"

      - name: Check the release notes before anything reaches PyPI
        # github-release writes and checks them again after the upload; checking here first
        # means notes that would be refused stop the run while PyPI is still untouched.
        if: steps.kind.outputs.final == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python -m pip install packaging
          python scripts/release_body.py --tag "$TAG" --output "$RUNNER_TEMP/release_body.md"

  publish-pypi:
    name: Publish to PyPI
    # In the tag push run, after verify-testpypi succeeded and only when the tag names a final
    # release. `needs:` orders it after the TestPyPI upload and its verification, and through them
    # after the build and every test leg. What is uploaded is this run's distribution artifact,
    # the files TestPyPI received; each file's sha256 must equal the one TestPyPI records for it
    # before anything is uploaded. The `pypi` environment's protection rules still apply here.
    needs: verify-testpypi
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.verify-testpypi.outputs.final == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/jnwb
    permissions:
      id-token: write  # Mandatory for PyPI Trusted Publishing (OIDC)
      contents: read
    steps:
      - name: Download the distribution artifacts TestPyPI received
        # No run-id: the artifact of this run, which build stored and publish-testpypi uploaded.
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Require every file to match its TestPyPI upload byte for byte
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          curl -fsSL "https://test.pypi.org/pypi/jnwb/$version/json" -o /tmp/testpypi.json
          remote=$(jq '.urls | length' /tmp/testpypi.json)
          count=0
          for file in dist/*; do
            name=$(basename "$file")
            # A yanked file stays listed with its digest, so the comparison below would pass it.
            if jq -e --arg name "$name" 'any(.urls[]; .filename == $name and .yanked == true)' /tmp/testpypi.json > /dev/null; then
              echo "::error::$name is yanked on TestPyPI's jnwb $version, so it is not the file to upload"
              exit 1
            fi
            want=$(jq -r --arg name "$name" '[.urls[] | select(.filename == $name) | .digests.sha256] | if length == 1 then .[0] else "" end' /tmp/testpypi.json)
            have=$(sha256sum "$file" | cut -d' ' -f1)
            if [ -z "$want" ] || [ "$want" != "$have" ]; then
              echo "::error::$name does not match TestPyPI's jnwb $version (sha256 $have, TestPyPI ${want:-none})"
              exit 1
            fi
            count=$((count + 1))
          done
          if [ "$count" -eq 0 ] || [ "$count" -ne "$remote" ]; then
            echo "::error::dist/ holds $count file(s) and TestPyPI's jnwb $version holds $remote"
            exit 1
          fi
          echo "all $count file(s) match TestPyPI's jnwb $version"

      - name: Publish to PyPI via Trusted Publishing
        # Same pin as the TestPyPI job, and for the same reason.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist/
          verbose: true

  verify-pypi:
    # The release as PyPI serves it: the tag's version installed from PyPI into a fresh environment,
    # its wheel checked against this run's build artifact before anything is installed, then the
    # smoke script the TestPyPI verification runs. Like publish-pypi, it runs only for a final
    # release, and it names verify-testpypi in `needs:` because its `if:` reads that job's output.
    name: Verify the PyPI upload
    needs: [verify-testpypi, publish-pypi]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.verify-testpypi.outputs.final == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Download the distribution artifacts of this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Install the tag's version from PyPI and smoke-test it
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          python -m venv /tmp/pypi_env
          /tmp/pypi_env/bin/pip install --upgrade pip
          # The index can lag the upload by minutes; ten attempts, thirty seconds apart.
          for attempt in $(seq 1 10); do
            if /tmp/pypi_env/bin/pip download --no-cache-dir --no-deps --only-binary :all: \
                --index-url https://pypi.org/simple/ "jnwb==$version" -d /tmp/candidate; then
              break
            fi
            if [ "$attempt" -eq 10 ]; then
              echo "::error::jnwb==$version could not be downloaded from PyPI"
              exit 1
            fi
            sleep 30
          done
          wheels=(/tmp/candidate/jnwb-*.whl)
          if [ "${#wheels[@]}" -ne 1 ] || [ ! -f "${wheels[0]}" ]; then
            echo "::error::expected one jnwb wheel from PyPI, found: ${wheels[*]}"
            exit 1
          fi
          # The wheel PyPI serves must be the one this run built and uploaded, byte for byte.
          python scripts/workflow_checks.py same-wheel dist/*.whl "${wheels[0]}"
          /tmp/pypi_env/bin/pip install --no-cache-dir "${wheels[0]}"
          /tmp/pypi_env/bin/pip check
          cd /tmp
          # PYTHONPATH is cleared, as in the tutorial step of the build job, so the checkout cannot
          # satisfy the import.
          unset PYTHONPATH
          /tmp/pypi_env/bin/python "$GITHUB_WORKSPACE/scripts/smoke_installed.py" \
            --expected-version "$version" --not-under "$GITHUB_WORKSPACE"

  github-release:
    name: Create the GitHub Release
    # After the PyPI upload and its check, in the same run. The notes are written by
    # scripts/release_body.py: the pinned install command, the supported Python range and the
    # version's CHANGELOG.md section, checked by the release gate's body check before the Release
    # is created. A violation fails the job before `gh release create` runs. The only job that
    # can write.
    needs: verify-pypi
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # To create the Release for this tag
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # The token can write; nothing after checkout needs it in .git/config.
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Write the release notes and check their claims
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python -m pip install packaging
          python scripts/release_body.py --tag "$TAG" --output "$RUNNER_TEMP/release_body.md"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release_body.md"
