name: tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with test extras
        run: pip install -e ".[test]" -q
      - name: Run pytest with coverage
        id: pytest
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --tb=short \
            --cov=jnwb --cov-report=term-missing --cov-report=xml \
            2>&1 | tee pytest_output.log
      - name: Write failure diagnostics to job summary
        if: failure()
        run: |
          echo "## Pytest failure output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 300 pytest_output.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Write coverage summary
        if: always()
        run: |
          echo "## Coverage (jnwb/)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 60 pytest_output.log | grep -A100 "^Name " >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
