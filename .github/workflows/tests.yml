name: tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Compile package
        run: python -m compileall jnwb -q
      - name: Show environment (diagnostic)
        if: always()
        run: |
          python --version
          pip list
      - name: Run pytest
        id: pytest
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --tb=long -rA 2>&1 | tee pytest_output.log
      - name: Write failure diagnostics to job summary
        if: failure()
        run: |
          echo "## Pytest failure output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 300 pytest_output.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
