<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="assets/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
</head>
<body class="dark-mode">
    <header>
        <div class="header-content">
            <h1>{{ title }}</h1>
            <p class="subtitle">Omission Project Static Archive</p>
            <div class="search-container">
                <input type="text" id="gallery-search" placeholder="Search figures, analyses, or signal types...">
            </div>
        </div>
    </header>

    <main>
        <aside class="filters">
            <section class="filter-group">
                <h3>Signal Class</h3>
                <div id="filter-signal" class="filter-options"></div>
            </section>
            <section class="filter-group">
                <h3>Time Base</h3>
                <div id="filter-time" class="filter-options"></div>
            </section>
            <section class="filter-group">
                <h3>Analysis</h3>
                <div id="filter-analysis" class="filter-options"></div>
            </section>
            <section class="filter-group">
                <h3>Type</h3>
                <div id="filter-type" class="filter-options"></div>
            </section>
            <button id="reset-filters" class="btn-secondary">Reset Filters</button>
        </aside>

        <section class="gallery-container">
            <div class="gallery-header">
                <span id="results-count">Showing all items</span>
                <div class="view-toggles">
                    <button id="view-grid" class="active">Grid</button>
                    <button id="view-list">List</button>
                </div>
            </div>
            <div id="gallery-grid" class="grid-view">
                <!-- Cards will be injected here -->
            </div>
        </section>
    </main>

    <div id="modal" class="modal">
        <span class="close">&times;</span>
        <div class="modal-content">
            <iframe id="modal-iframe" src="" frameborder="0"></iframe>
            <img id="modal-img" src="" alt="">
        </div>
        <div id="modal-caption"></div>
    </div>

    <footer>
        <p>&copy; 2026 Omission Project. Generated by Antigravity.</p>
        <p class="manifest-info">Manifest: <a href="manifests/gallery_manifest.json" target="_blank">gallery_manifest.json</a></p>
    </footer>

    <script src="assets/gallery.js"></script>
</body>
</html>
