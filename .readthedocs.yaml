version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

python:
  install:
    # One source of truth. docs/requirements.txt used to be installed first and held a
    # byte-identical copy of the [docs] extra; nothing compared them, and with
    # fail_on_warning below a drift is a failed publish rather than a warning.
    - method: pip
      path: .
      extra_requirements:
        - docs

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true

